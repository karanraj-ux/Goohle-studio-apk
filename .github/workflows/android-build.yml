name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APKs
      run: ./gradlew assembleRelease assembleDebug --no-daemon
      env:
        STORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey
        KEY_PASSWORD: android

    - name: Rename APKs
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ShieldApp-release.apk || true
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ShieldApp-release-unsigned.apk || true
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ShieldApp-debug.apk || true

    - name: Upload Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: Shield-Distribution-Build
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
