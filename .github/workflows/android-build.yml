name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Generate temporary debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore
        
    - name: Fix Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: |
        cp debug.keystore release.keystore
        ./gradlew assembleRelease --no-daemon
      env:
        STORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ShieldApp.apk || true
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ShieldApp.apk || true
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ShieldApp.apk || true

    - name: Upload Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: Shield-Distribution-Build
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
